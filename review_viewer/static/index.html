<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RA 문서 검토</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">RA</span><div><h1>문서 검토</h1><p>원문과 전처리 결과를 한 화면에서</p></div></div>
    <div class="metrics" id="metrics"></div>
    <div class="local-badge"><span></span>로컬 · 읽기 전용</div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-head"><span class="eyebrow">DOCUMENTS</span><span id="doc-count"></span></div>
      <nav id="documents" aria-label="문서 선택"></nav>
      <div class="page-tools">
        <label class="search"><span>⌕</span><input id="search" type="search" placeholder="이 문서의 본문에서 검색" aria-label="문서 본문 검색"></label>
        <div class="segments" id="page-filter"><button data-kind="all" class="active">전체</button><button data-kind="visual">표·그림</button><button data-kind="review">검토 필요</button></div>
        <p id="page-count" class="muted"></p>
      </div>
      <nav id="pages" aria-label="페이지 선택"></nav>
      <footer class="sidebar-footer"><span class="integrity-dot"></span> 저장 파일·원본 해시 확인<span id="run-name"></span></footer>
    </aside>
    <section class="document-workspace">
      <div class="document-toolbar">
        <div class="document-heading"><span class="eyebrow" id="document-source"></span><h2 id="document-title">문서를 불러오는 중…</h2></div>
        <div class="navigation"><button id="prev" aria-label="이전 페이지">←</button><label><input id="page-number" type="number" min="1" aria-label="물리 페이지 번호"><span id="page-total"></span></label><button id="next" aria-label="다음 페이지">→</button></div>
        <a id="open-pdf" class="text-button" target="_blank" rel="noopener">원본 PDF ↗</a>
      </div>
      <div class="panels">
        <section class="original-panel">
          <div class="panel-toolbar"><div><span class="panel-label" id="source-page-label">원본 페이지</span><span class="small muted" id="page-meta"></span></div><div class="image-controls"><label class="small"><input id="overlay-toggle" type="checkbox" checked>영역 표시</label><button id="zoom-out" aria-label="축소">−</button><button id="zoom-fit">맞춤</button><button id="zoom-in" aria-label="확대">＋</button></div></div>
          <div class="paper-scroll" id="paper-scroll"><div class="paper" id="paper"><img id="page-image" alt="원본 PDF 페이지"><svg id="overlay" aria-label="추출 영역" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="paper-placeholder" id="paper-placeholder">문서를 선택해 주세요.</div></div>
          <div class="original-footer"><div class="legend"><span class="legend-text">본문</span><span class="legend-table">표</span><span class="legend-figure">그림</span><span class="legend-group">그림 부모</span></div><span>영역을 누르면 오른쪽 결과가 열립니다.</span></div>
        </section>
        <section class="results-panel">
          <div class="tabs" id="tabs"><button data-tab="assets" class="active">추출 결과 <span id="asset-count"></span></button><button data-tab="chunks">청크 <span id="chunk-count"></span></button><button data-tab="reviews">검토 항목 <span id="review-count"></span></button></div>
          <div class="result-tools"><div class="segments" id="asset-filter"><button data-kind="all" class="active">전체</button><button data-kind="text">본문</button><button data-kind="table">표</button><button data-kind="figure">그림</button></div><button class="text-button" id="copy-link">현재 위치 링크</button></div>
          <div class="results-scroll" id="results"><div class="empty">저장된 추출 결과를 불러오는 중입니다.</div></div>
          <div class="results-footer">자동 추출 결과입니다. 문자 대조 통과는 의미·수치 정확도 확정을 뜻하지 않습니다.</div>
        </section>
      </div>
    </section>
  </main>
  <div class="toast" role="status" id="toast" hidden></div>
  <div class="fatal" id="fatal" hidden><h2>결과를 불러오지 못했습니다.</h2><p></p><button id="retry">다시 불러오기</button></div>
</body>
</html>
